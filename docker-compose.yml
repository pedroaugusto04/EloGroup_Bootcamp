services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertice_analytics_app
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./tests:/app/tests
      - ./.env:/app/.env:ro
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: vertice_analytics_tests
    command: ["pytest", "tests/"]
    profiles:
      - test
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/install/lib/python3.12/site-packages:/app
