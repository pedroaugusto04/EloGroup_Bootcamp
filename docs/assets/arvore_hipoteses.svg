<title id="title">Árvore de hipóteses da Vértice Retail</title><desc id="desc">Hipóteses avaliadas nas frentes comercial e operação, atendimento, crescimento e dados, com destaque para as quatro selecionadas.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.root{fill:#7650a8}.rootText{fill:#fff;font-size:29px;font-weight:700}.group{fill:#5d318f}.groupMuted{fill:#65717f}.groupText{fill:#fff;font-size:19px;font-weight:700;letter-spacing:.4px}.selected{fill:#f4eefb;stroke:#7b55aa;stroke-width:2.5}.other{fill:#f7f8fa;stroke:#cbd2da;stroke-width:2}.titleText{font-size:18px;font-weight:700}.selectedStatus{font-size:15px;font-weight:700;fill:#6d42ad}.status{font-size:15px;font-weight:700;fill:#5d6976}.line{stroke:#aeb8c4;stroke-width:3;fill:none}.caption{font-size:16px;fill:#64748b}</style>
