name: CI/CD Deploy Vértice Analytics

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "data/raw/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - "scripts/deploy/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: vertice-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/home/ubuntu/vertice-analytics' }}
  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}

jobs:
  test:
    name: Testes e validação dos dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Pré-processar dados
        run: python -m src.infrastructure.preprocessor
      - name: Executar testes
        run: python -m pytest tests/

  deploy:
    name: Build e deploy na VPS
    runs-on: ubuntu-latest
    needs: test
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar owner do GHCR
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Gerar configuração de produção
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || 'https://chat.eloagents.click/api' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gemini-3-flash-preview' }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || '0.1' }}
          LLM_REQUEST_TIMEOUT: ${{ vars.LLM_REQUEST_TIMEOUT || '45' }}
          AUDIT_RECURSION_LIMIT: ${{ vars.AUDIT_RECURSION_LIMIT || '25' }}
          COPILOT_RECURSION_LIMIT: ${{ vars.COPILOT_RECURSION_LIMIT || '15' }}
          AUDIT_SNAPSHOT_PATH: ${{ vars.AUDIT_SNAPSHOT_PATH || 'data/processed/latest_audit_snapshot.json' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || 'Vertice Analytics <onboarding@resend.dev>' }}
          RESEND_TO_EMAIL: ${{ vars.RESEND_TO_EMAIL || 'diretoria@verticeretail.com.br' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          AGENT_DEEP_LINK_PATH: ${{ vars.AGENT_DEEP_LINK_PATH || '/?view=agent&source=email' }}
          AUDIT_CRON_SCHEDULE: ${{ vars.AUDIT_CRON_SCHEDULE || '0 7 * * 1' }}
        run: bash scripts/deploy/generate-env.sh .deploy/vertice.env

      - name: Validar acesso à VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing secret: VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing secret: VPS_USER"; exit 1; }
          test -n "$VPS_KEY" || { echo "Missing secret: VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$APP_BASE_URL" || { echo "Missing variable: APP_BASE_URL"; exit 1; }
          mkdir -p ~/.ssh
          printf '%b\n' "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "command -v docker >/dev/null && docker compose version >/dev/null"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar QEMU para build ARM
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/vertice-analytics:latest
            ghcr.io/${{ steps.owner.outputs.value }}/vertice-analytics:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sincronizar compose e ambiente
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_APP_DIR'"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p $VPS_SSH_PORT -o StrictHostKeyChecking=yes" \
            .deploy/vertice.env docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Atualizar serviço na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ steps.owner.outputs.value }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' VPS_APP_DIR='$VPS_APP_DIR' IMAGE_TAG='$IMAGE_TAG' GHCR_OWNER='$GHCR_OWNER' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$VPS_APP_DIR"
          chmod 600 vertice.env
          cp -f vertice.env .env.prod
          echo "$GH_TOKEN" | sudo docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          image="ghcr.io/$GHCR_OWNER/vertice-analytics:$IMAGE_TAG"
          sudo VERTICE_IMAGE="$image" docker compose --env-file .env.prod -f docker-compose.prod.yml pull app
          sudo VERTICE_IMAGE="$image" docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans app
          sudo docker compose --env-file .env.prod -f docker-compose.prod.yml ps
          sudo docker logout ghcr.io
          sudo docker image prune -f
          REMOTE
