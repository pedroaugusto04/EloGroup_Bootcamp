<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img">
<defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', Inter, -apple-system, sans-serif; fill: #37183E; }
      .root { fill: #37183E; }
      .rootText { fill: #FFFFFF; font-size: 24px; font-weight: 800; }
      .group { fill: #561265; }
      .groupMuted { fill: #655A70; }
      .groupText { fill: #FFFFFF; font-size: 16px; font-weight: 800; letter-spacing: 0.6px; }
      .selected { fill: #F7EFFB; stroke: #561265; stroke-width: 2; }
      .other { fill: #FFFFFF; stroke: #DEC6E4; stroke-width: 1.5; }
      .titleText { font-size: 16px; font-weight: 700; fill: #37183E; }
      .selectedStatus { font-size: 13.5px; font-weight: 800; fill: #561265; }
      .status { font-size: 13.5px; font-weight: 700; fill: #7E7585; }
      .line { stroke: #DEC6E4; stroke-width: 2.5; fill: none; }
      .caption { font-size: 14px; font-weight: 600; fill: #5D5860; }
    </style>
  </defs>
<rect width="1600" height="920" fill="#FAF8FB" />
<rect class="root" x="300" y="40" width="1000" height="76" rx="14" />
<text class="rootText" x="800" y="86" text-anchor="middle">Onde estão as oportunidades de margem e produtividade?</text>
<path class="line" d="M800 116 V145 H285 V175 M800 145 H800 V175 M800 145 H1315 V175" />
<rect class="group" x="40" y="175" width="490" height="48" rx="10" /><text class="groupText" x="285" y="205" text-anchor="middle">COMERCIAL E OPERAÇÃO</text>
<rect class="group" x="555" y="175" width="490" height="48" rx="10" /><text class="groupText" x="800" y="205" text-anchor="middle">ATENDIMENTO</text>
<rect class="groupMuted" x="1070" y="175" width="490" height="48" rx="10" /><text class="groupText" x="1315" y="205" text-anchor="middle">CRESCIMENTO E DADOS</text>
<rect class="selected" x="40" y="244" width="490" height="110" rx="12" /><rect x="40" y="244" width="5" height="110" rx="2" fill="#E000D2" />
<text class="titleText" x="65" y="289">Estoque descontinuado e ruptura exigem ação?</text>
<text class="selectedStatus" x="65" y="324">SUSTENTADA · SELECIONADA 1</text>
<rect class="selected" x="40" y="370" width="490" height="110" rx="12" /><rect x="40" y="370" width="5" height="110" rx="2" fill="#E000D2" />
<text class="titleText" x="65" y="415">Descontos elevados aumentam o volume?</text>
<text class="selectedStatus" x="65" y="450">NÃO SUSTENTADA · SELECIONADA 2</text>
<rect class="other" x="40" y="496" width="490" height="110" rx="12" />
<text class="titleText" x="65" y="541">Atraso de entrega explica as devoluções?</text>
<text class="status" x="65" y="576">NÃO SUSTENTADA · FORA DO CICLO</text>
<rect class="other" x="40" y="622" width="490" height="110" rx="12" />
<text class="titleText" x="65" y="667">Defeito e tamanho explicam devoluções?</text>
<text class="status" x="65" y="702">SUSTENTADA · FORA DO CICLO</text>
<rect class="selected" x="555" y="244" width="490" height="110" rx="12" /><rect x="555" y="244" width="5" height="110" rx="2" fill="#E000D2" />
<text class="titleText" x="580" y="289">Rastreio gera contatos evitáveis?</text>
<text class="selectedStatus" x="580" y="324">SUSTENTADA · SELECIONADA 3</text>
<rect class="selected" x="555" y="370" width="490" height="110" rx="12" /><rect x="555" y="370" width="5" height="110" rx="2" fill="#E000D2" />
<text class="titleText" x="580" y="415">Dúvidas técnicas podem ser atendidas no N1?</text>
<text class="selectedStatus" x="580" y="450">SUSTENTADA · SELECIONADA 4</text>
<rect class="other" x="1070" y="244" width="490" height="110" rx="12" />
<text class="titleText" x="1095" y="289">O mix de canais está eficiente?</text>
<text class="status" x="1095" y="324">INCONCLUSIVA · FORA DO CICLO</text>
<rect class="other" x="1070" y="370" width="490" height="110" rx="12" />
<text class="titleText" x="1095" y="415">A base de Clientes reflete as Vendas?</text>
<text class="status" x="1095" y="450">NÃO SUSTENTADA · FORA DO CICLO</text>
<rect class="other" x="1070" y="496" width="490" height="110" rx="12" />
<text class="titleText" x="1095" y="541">A principal limitação é a falta de dados?</text>
<text class="status" x="1095" y="576">NÃO SUSTENTADA · TRATAR NA GOVERNANÇA</text>
<circle cx="560" cy="875" r="8" fill="#561265" /><text x="580" y="880" class="caption">Hipótese ligada a uma iniciativa selecionada (Ciclo 90 dias)</text>
<circle cx="1060" cy="875" r="8" fill="#DEC6E4" /><text x="1080" y="880" class="caption">Hipótese fora do ciclo / governança</text>
</svg>