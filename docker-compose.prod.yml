services:
  app:
    image: ${VERTICE_IMAGE:-ghcr.io/pedroaugusto04/elgroup_bootcamp:latest}
    container_name: vertice_analytics_app
    restart: unless-stopped
    ports:
      - "${VERTICE_PORT:-8501}:8501"
    env_file:
      - .env.prod
    volumes:
      - vertice_storage:/app/data/storage
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  vertice_storage:
    name: vertice_analytics_storage
